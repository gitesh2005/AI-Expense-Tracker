spring.application.name=expense-tracker

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/expense_tracker}
spring.data.mongodb.auto-index-creation=true

groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:}
groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
groq.screenshot-model=${GROQ_SCREENSHOT_MODEL:qwen/qwen3.6-27b}

# Set JWT_SECRET in the deployment environment; do not commit credentials.
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration=${JWT_EXPIRATION_SECONDS:3600}

server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://ai-expense-tracker-frontend.netlify.app}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
